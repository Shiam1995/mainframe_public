<body>
  <!-- CRT boot screen: covers the app from first paint; boot.js fills + animates it. -->
  <div id="boot" class="boot"><div class="crt-overlay"></div></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">MAINFRAME<span class="brand-accent"> / SYNAPSE</span></span>
    </div>
    <div id="module-switch" class="module-switch"><!-- module buttons injected by app.js --></div>
    <nav id="tabs" class="tabs"><!-- tabs injected by app.js --></nav>
    <!-- Dictation, always within reach: the mic types into whatever box you were
         last in, so it works on every screen without each view wiring it up. -->
    <button id="vt-mic" class="vt-mic" title="dictate into the box you're typing in">◉</button>
    <div class="status" id="status-pill" title="backend status">
      <span class="dot" id="dot-neo4j"></span>neo4j
      <span class="dot" id="dot-llm"></span><span id="llm-label">llm</span>
    </div>
  </header>

  <!-- second bar: the active module's own tabs (tinted the module colour) -->
  <nav id="module-tabs" class="module-bar"><!-- module tabs injected by app.js --></nav>

  <main class="layout">
    <aside id="context-panel" class="context-panel hidden">
      <!-- paper context (workspace) injected here -->
    </aside>
    <section id="view" class="view"><!-- active view rendered here --></section>
  </main>

  <button id="back-home" class="back-home">← mainframe</button>
  <div id="home" class="home-screen"></div>

  <div id="toast" class="toast hidden"></div>
