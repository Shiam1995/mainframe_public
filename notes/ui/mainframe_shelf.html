<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mainframe Shelf</title>
<style>
:root{--bg:#0B0F14;--surface:#141A22;--raised:#1B2330;--border:#232d3b;--text:#dfe6ee;--muted:#8194a8;--dim:#6b7c92;
--teal:#00D4AA;--pink:#FF4F9A;--red:#E0585A;--gold:#E8B84A;--lime:#C6F04A;--purple:#9B7BFF;--amber:#F0A030;
--mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0F14}}
:root[data-theme="dark"]{--bg:#0B0F14}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13.5px}
.page{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
button{font:inherit;cursor:pointer;color:var(--text);background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:6px 11px}
button:hover{border-color:var(--teal)}
.frame{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.counts{display:flex;gap:14px;font-family:var(--mono);font-size:15px;font-weight:600}
.counts span{display:flex;align-items:center;gap:6px}
.counts i{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid}
.tabs{display:flex;gap:4px;margin:0 auto;background:var(--bg);padding:3px;border-radius:10px;border:1px solid var(--border)}
.tab{border:0;background:none;padding:6px 14px;border-radius:7px;color:var(--muted);font-weight:600;display:flex;gap:7px;align-items:center}
.tab b{font-family:var(--mono);font-size:11px;background:var(--raised);padding:1px 6px;border-radius:5px;color:var(--muted)}
.tab.on{background:var(--raised);color:var(--text)}
.tab.on b{color:var(--bg);background:var(--lime)}
.tab.drop{outline:2px dashed var(--lime)}
.sortsel{font:inherit;background:var(--raised);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);align-items:center}
.filters .sep{width:1px;height:28px;background:var(--border);margin:0 4px}
.fb{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:9px;background:var(--bg);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:600}
.fb .sq{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:#fff;opacity:.55}
.fb b{font-family:var(--mono);font-size:10.5px;color:var(--dim);font-weight:500}
.fb.on{color:var(--text);border-color:currentColor;background:var(--raised)}
.fb.on .sq{opacity:1}
.fb.zero{opacity:.35}
.fclear{font-size:11.5px;color:var(--muted);background:none;border:0;margin-left:auto}
.shelfwrap{position:relative;background:repeating-linear-gradient(90deg,#3a2a1c 0 3px,#2c1f14 3px 7px,#33251a 7px 12px);padding:34px 14px 0;overflow-x:auto}
.shelf{display:flex;gap:8px;align-items:flex-end;min-height:356px}
.ledge{height:12px;background:linear-gradient(#e9e2d0,#bdb4a0);border-top:1px solid #fff6}
.spine{flex:0 0 82px;height:330px;border-radius:5px 5px 2px 2px;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(90deg,#d9d2bf,#ece6d6 40%,#cfc7b2);color:#2a2a2a;box-shadow:inset -3px 0 0 #0002,2px 0 4px #0006;transition:transform .15s}
.spine:hover{transform:translateY(-6px)}
.spine.sel{transform:translateY(-14px)}
.spine .band{position:absolute;left:4px;right:4px;height:4px;border-radius:2px}
.spine .band.t{top:8px}.spine .band.b{bottom:38px}
.spine .ico{margin-top:20px;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:14px;color:#fff}
.spine .ttl{writing-mode:vertical-rl;font-weight:700;font-size:20px;margin-top:10px;max-height:178px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.spine .hrs{position:absolute;bottom:56px;left:0;right:0;text-align:center;font-family:var(--mono);font-weight:800;font-size:22px;line-height:1}
.spine .hrs small{font-size:12px;font-weight:600;opacity:.7;margin-left:1px}
.spine .prog{position:absolute;left:6px;bottom:46px;width:calc(100% - 12px);height:5px;background:#0002;border-radius:2px;overflow:hidden}
.spine .prog i{display:block;height:100%}
.spine .num{position:absolute;bottom:8px;font-family:var(--mono);font-weight:700;font-size:18px}
.spine.done{background:linear-gradient(90deg,#e8cf86,#f6e3a6 40%,#d6b866)}
.spine.later{filter:saturate(.35) brightness(.78)}
.seal{position:absolute;top:-10px;right:-6px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a0,#d39b1e);border:2px solid #8a6312;font-size:11px;display:grid;place-items:center;color:#5a3d00}
.dust{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;background:#0009;color:#cbd;padding:1px 4px;border-radius:3px;white-space:nowrap}
.marker{position:absolute;top:6px;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:20px solid var(--teal);filter:drop-shadow(0 0 6px var(--teal));transition:left .15s}
.empty-slot{flex:0 0 82px;height:330px;border:2px dashed #ffffff22;border-radius:5px;display:grid;place-items:center;color:#ffffff40;font-size:22px}
.hint{padding:12px 16px;color:var(--dim);font-size:12.5px;text-align:center}
.info{border-top:1px solid var(--border);background:var(--raised);padding:18px;display:none}
.info.open{display:block;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.ih{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.big{width:60px;height:60px;border-radius:13px;display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:20px;color:#fff}
.it{font-size:19px;font-weight:700}
.im{color:var(--muted);font-size:12.5px;margin-top:3px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.close{background:none;border:0;color:var(--muted);font-size:18px;padding:4px 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.st{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.st .k{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.st .v{font-size:20px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.pbar{height:8px;border-radius:4px;background:var(--surface);overflow:hidden;margin-top:4px}.pbar i{display:block;height:100%}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media (max-width:820px){.cols{grid-template-columns:1fr}.ih{grid-template-columns:auto 1fr}.acts{grid-column:1/-1;justify-content:flex-start}}
.box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px}
.box h4{margin:0 0 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.ses{list-style:none;margin:0;padding:0}
.ses li{display:grid;grid-template-columns:70px 1fr 50px;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.ses li:last-child{border:0}
.ses .d{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ses .h{font-family:var(--mono);text-align:right}
.week{display:flex;gap:4px;align-items:flex-end;height:60px;margin-top:6px}
.week span{flex:1;border-radius:3px 3px 0 0;min-height:2px}
.wl{display:flex;gap:4px;font-family:var(--mono);font-size:9.5px;color:var(--dim)}.wl span{flex:1;text-align:center}
.take{font-size:13px;line-height:1.5}
.take .q{border-left:3px solid var(--gold);padding-left:10px;color:var(--text)}
.next{margin-top:10px;font-size:12.5px;color:var(--muted)}.next b{color:var(--text)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--lime);padding:8px 16px;border-radius:999px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style></head><body><div class="page">

<div class="frame">
  <div class="topbar">
    <div class="counts">
      <span><i style="border-color:var(--teal)"></i><b id="cAll">0</b></span>
      <span style="color:var(--gold)"><i style="border-color:var(--gold);background:var(--gold)"></i><b id="cDone">0</b></span>
      <span style="color:var(--muted)">⏱ <b id="cHrs" style="color:var(--text)">0</b>h</span>
    </div>
    <div class="tabs">
      <button class="tab on" data-s="master">Master <b>0</b></button>
      <button class="tab" data-s="main">Current <b>0</b></button>
      <button class="tab" data-s="later">Come back later <b>0</b></button>
      <button class="tab" data-s="done">Finished <b>0</b></button>
    </div>
    <select class="sortsel" id="sort">
      <option value="num">numerical order</option><option value="hours">most hours</option>
      <option value="area">by area</option><option value="type">by type</option>
      <option value="prog">by progress</option><option value="touched">last touched</option>
    </select>
  </div>
  <div class="filters" id="filters"></div>
  <div class="shelfwrap"><div class="marker" id="marker"></div><div class="shelf" id="shelf"></div></div>
  <div class="ledge"></div>
  <div class="hint" id="hint">press a book to see its info</div>
  <div class="info" id="info"></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
const AREA={synapse:'#00D4AA',pulse:'#FF4F9A',vision:'#E0585A',vault:'#E8B84A',glass:'#9B7BFF'};
const AREA_NAME={synapse:'Synapse',pulse:'Pulse',vision:'Vision',vault:'Vault',glass:'Builds'};
const TYPE={book:'Bk',paper:'Pp',course:'Cr',project:'Pj',video:'Vd',plan:'Pl'};
const TYPE_NAME={book:'Books',paper:'Papers',course:'Courses',project:'Projects',video:'Videos',plan:'Plans'};
const SHELF={main:'Current',later:'Come back later',done:'Finished'};
let items=[
 {n:1,t:'Intro to Statistics',type:'book',area:'synapse',p:30,s:'main',h:15,unit:'ch 6 / 18',touched:1,next:'Ch 7: regression'},
 {n:2,t:'Systems Design 101',type:'book',area:'synapse',p:14,s:'main',h:5,unit:'ch 2 / 9',touched:2,next:'Ch 3: caching'},
 {n:3,t:'Algorithms drills',type:'course',area:'synapse',p:45,s:'main',h:20,unit:'54 / 120',touched:0,next:'2 graph mediums'},
 {n:4,t:'App polish',type:'project',area:'synapse',p:50,s:'main',h:28,unit:'10 / 20 tasks',touched:0,next:'shelf in the Repo tab'},
 {n:5,t:'Base cardio',type:'plan',area:'pulse',p:25,s:'main',h:8,unit:'wk 3 / 12',touched:1,next:'easy run, 30 min'},
 {n:6,t:'Explainer ep 2',type:'video',area:'vision',p:15,s:'main',h:3,unit:'script',touched:4,next:'finish the script draft'},
 {n:7,t:'Classic Textbook',type:'book',area:'synapse',p:8,s:'later',h:3,unit:'ch 2 / 25',touched:34,next:'Ch 3: search'},
 {n:8,t:'Linear Algebra Notes',type:'book',area:'synapse',p:5,s:'later',h:2,unit:'ch 1 / 16',touched:41,next:'Ch 2: vector spaces'},
 {n:9,t:'Sample paper',type:'paper',area:'synapse',p:0,s:'later',h:0,unit:'0 / 30 pp',touched:12,next:'first pass, abstract and figures'},
 {n:10,t:'Hardware kit',type:'project',area:'glass',p:18,s:'later',h:12,unit:'stage 1',touched:20,next:'order the parts'},
 {n:11,t:'Game prototype',type:'project',area:'glass',p:40,s:'later',h:22,unit:'level 1',touched:22,next:'pathing between rooms'},
 {n:12,t:'Video lecture series',type:'course',area:'synapse',p:100,s:'done',h:18,unit:'10 / 10',touched:30,take:'the worked examples finally clicked'},
 {n:13,t:'Survey paper',type:'paper',area:'synapse',p:100,s:'done',h:4,unit:'L3 understood',touched:9,take:'the taxonomy in section 2 is the useful part'},
 {n:14,t:'Strength base',type:'plan',area:'pulse',p:100,s:'done',h:14,unit:'6 wks',touched:15,take:'3 sessions a week is the real limit'},
 {n:15,t:'Small tab',type:'project',area:'vault',p:100,s:'done',h:6,unit:'shipped',touched:3,take:'small tabs ship faster'},
];
function sessions(x){
  if(!x.h) return [];
  const out=[];let left=x.h,day=x.touched,seed=x.n*7;
  while(left>0&&out.length<8){seed=(seed*31+11)%97;const h=Math.min(left,[0.5,1,1,1.5,2,2.5][seed%6]);out.push({d:day,h});left-=h;day+=1+seed%4;}
  return out;
}
const MAX_MAIN=6;
let cur='master', open=null, sortBy='num';
const F={area:new Set(),type:new Set()};
const $=id=>document.getElementById(id);
const pass=x=>(!F.area.size||F.area.has(x.area))&&(!F.type.size||F.type.has(x.type));
const ago=d=>d===0?'today':d===1?'yesterday':d+'d ago';
const dstr=d=>{const t=new Date();t.setDate(t.getDate()-d);return t.toLocaleDateString('en-GB',{day:'numeric',month:'short'});};

function list(){
  const k={num:(x,y)=>x.n-y.n,hours:(x,y)=>y.h-x.h,area:(x,y)=>x.area.localeCompare(y.area)||x.n-y.n,type:(x,y)=>x.type.localeCompare(y.type)||x.n-y.n,prog:(x,y)=>y.p-x.p,touched:(x,y)=>x.touched-y.touched};
  return items.filter(x=>(cur==='master'||x.s===cur)&&pass(x)).sort(k[sortBy]);
}
function renderFilters(){
  const el=$('filters');el.innerHTML='';
  const on=items.filter(x=>cur==='master'||x.s===cur);
  const mk=(kind,key,label,color,glyph)=>{
    const n=on.filter(x=>x[kind]===key&&(kind==='area'?(!F.type.size||F.type.has(x.type)):(!F.area.size||F.area.has(x.area)))).length;
    const b=document.createElement('button');b.className='fb'+(F[kind].has(key)?' on':'')+(n?'':' zero');
    if(F[kind].has(key)) b.style.color=color;
    b.innerHTML=`<span class="sq" style="background:${color}">${glyph}</span>${label} <b>${n}</b>`;
    b.onclick=()=>{F[kind].has(key)?F[kind].delete(key):F[kind].add(key);render();};el.append(b);
  };
  Object.keys(AREA_NAME).forEach(k=>mk('area',k,AREA_NAME[k],AREA[k],AREA_NAME[k][0]));
  el.insertAdjacentHTML('beforeend','<span class="sep"></span>');
  Object.keys(TYPE_NAME).forEach(k=>mk('type',k,TYPE_NAME[k],'#8194a8',TYPE[k]));
  if(F.area.size||F.type.size){const c=document.createElement('button');c.className='fclear';c.textContent='clear filters ✕';c.onclick=()=>{F.area.clear();F.type.clear();render();};el.append(c);}
}
function render(){
  renderFilters();
  const a=list();
  if(open&&!a.find(x=>x.n===open)) open=null;
  const sh=$('shelf');sh.innerHTML='';
  a.forEach(x=>{
    const c=AREA[x.area],d=document.createElement('div');
    d.className='spine '+(x.s==='done'?'done':x.s==='later'?'later':'')+(x.n===open?' sel':'');
    d.draggable=true;
    d.innerHTML=`<i class="band t" style="background:${c}"></i><div class="ico" style="background:${c}">${TYPE[x.type]}</div><div class="ttl"></div>
      <div class="hrs">${x.h}<small>h</small></div><div class="prog"><i style="width:${x.p}%;background:${c}"></i></div><i class="band b" style="background:${c}"></i><div class="num">${x.n}</div>`;
    d.querySelector('.ttl').textContent=x.t;
    if(x.s==='done') d.insertAdjacentHTML('beforeend','<div class="seal">★</div>');
    if(x.s==='later'&&x.touched>=14) d.insertAdjacentHTML('beforeend',`<div class="dust">since ${x.touched}d</div>`);
    d.onclick=()=>{open=open===x.n?null:x.n;render();if(open)setTimeout(()=>$('info').scrollIntoView({behavior:'smooth',block:'nearest'}),30);};
    d.ondragstart=e=>e.dataTransfer.setData('text/plain',x.n);
    sh.append(d);
  });
  if(cur==='main'&&!F.area.size&&!F.type.size) for(let k=a.length;k<MAX_MAIN;k++) sh.insertAdjacentHTML('beforeend','<div class="empty-slot">+</div>');
  requestAnimationFrame(()=>{const i=a.findIndex(x=>x.n===open),s=sh.children[i],m=$('marker');if(s){m.style.display='';m.style.left=(s.offsetLeft+28)+'px';}else m.style.display='none';});
  document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('on',t.dataset.s===cur);t.querySelector('b').textContent=t.dataset.s==='master'?items.length:items.filter(x=>x.s===t.dataset.s).length;});
  $('cAll').textContent=items.length;$('cDone').textContent=items.filter(x=>x.s==='done').length;$('cHrs').textContent=items.reduce((s,x)=>s+x.h,0);
  renderInfo();
}
function renderInfo(){
  const el=$('info'),x=items.find(i=>i.n===open);
  $('hint').style.display=x?'none':'';
  el.classList.toggle('open',!!x);if(!x){el.innerHTML='';return;}
  const c=AREA[x.area],ss=sessions(x);
  const wk=[0,0,0,0,0,0,0,0];ss.forEach(s=>{const w=Math.floor(s.d/7);if(w<8)wk[7-w]+=s.h;});
  const mx=Math.max(1,...wk);
  el.innerHTML=`<div class="ih"><div class="big" style="background:${c}">${TYPE[x.type]}</div>
    <div><div class="it"></div><div class="im">#${x.n} · ${TYPE_NAME[x.type].slice(0,-1).toLowerCase()} · ${AREA_NAME[x.area]} · on ${SHELF[x.s]}</div></div>
    <div class="acts" id="acts"></div></div>
    <div class="stats">
      <div class="st"><div class="k">hours</div><div class="v">${x.h} h</div></div>
      <div class="st"><div class="k">progress</div><div class="v">${x.p}%</div><div class="pbar"><i style="width:${x.p}%;background:${c}"></i></div></div>
      <div class="st"><div class="k">up to</div><div class="v" style="font-size:16px">${x.unit}</div></div>
      <div class="st"><div class="k">sessions</div><div class="v">${ss.length}</div></div>
      <div class="st"><div class="k">last touched</div><div class="v" style="font-size:16px">${ago(x.touched)}</div></div>
    </div>
    <div class="cols">
      <div class="box"><h4>recent sessions</h4><ul class="ses">${ss.length?ss.map(s=>`<li><span class="d">${dstr(s.d)}</span><span>${x.unit.split('/')[0].trim()}</span><span class="h">${s.h} h</span></li>`).join(''):'<li><span></span><span style="color:var(--dim)">no sessions yet</span><span></span></li>'}</ul></div>
      <div class="box"><h4>hours per week, last 8 weeks</h4>
        <div class="week">${wk.map(h=>`<span style="height:${h/mx*100}%;background:${h?c:'var(--raised)'}" title="${h} h"></span>`).join('')}</div>
        <div class="wl">${wk.map((_,i)=>`<span>${i===7?'now':'-'+(7-i)}</span>`).join('')}</div>
        <div class="take" style="margin-top:14px">${x.take?'<h4>takeaway</h4><div class="q"></div>':''}</div>
        ${x.next&&x.s!=='done'?`<div class="next">next: <b></b></div>`:''}
      </div>
    </div>`;
  el.querySelector('.it').textContent=x.t;
  if(x.take) el.querySelector('.q').textContent=x.take;
  if(x.next&&x.s!=='done') el.querySelector('.next b').textContent=x.next;
  const acts=$('acts');
  const add=(l,fn)=>{const b=document.createElement('button');b.textContent=l;b.onclick=fn;acts.append(b);};
  add('▶ start session',()=>toast('session started on '+x.t));
  if(x.s!=='main') add('→ Current',()=>move(x,'main'));
  if(x.s!=='later') add('→ Later',()=>move(x,'later'));
  if(x.s!=='done') add('✓ Finished',()=>move(x,'done'));
  const cl=document.createElement('button');cl.className='close';cl.textContent='✕';cl.title='close';cl.onclick=()=>{open=null;render();};acts.append(cl);
}
function move(x,to){
  if(to==='main'&&items.filter(i=>i.s==='main').length>=MAX_MAIN){toast('Current is full (6). send one to Later first');return;}
  if(to==='done'){const t=prompt('one-line takeaway before it goes on Finished:',x.take||'');if(t===null)return;x.take=t||'—';x.p=100;}
  x.s=to;x.touched=0;toast(x.t+' → '+SHELF[to]);render();
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800);}
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{cur=t.dataset.s;render();};
  t.ondragover=e=>{e.preventDefault();t.classList.add('drop');};
  t.ondragleave=()=>t.classList.remove('drop');
  t.ondrop=e=>{e.preventDefault();t.classList.remove('drop');const x=items.find(i=>i.n==e.dataTransfer.getData('text/plain'));if(x&&t.dataset.s!=='master'&&x.s!==t.dataset.s)move(x,t.dataset.s);};
});
$('sort').onchange=e=>{sortBy=e.target.value;render();};
